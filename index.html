<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Оцените тестирование</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #2b1055 0%, #12082e 60%, #090418 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    touch-action: manipulation;
  }

  /* Надпись по центру */
  #title {
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 84%;
    text-align: center;
    color: #fff;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: .3px;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
    z-index: 5;
    pointer-events: none;
  }
  #title small {
    display: block;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    opacity: .7;
  }

  /* Сердечко */
  #heart {
    position: fixed;
    top: 0; left: 0;
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    cursor: pointer;
    z-index: 10;
    will-change: transform;
    /* базовая позиция задаётся через transform в JS */
    filter: drop-shadow(0 4px 14px rgba(255,0,80,.6));
  }
  /* эмодзи-сердечко: покачивание/дрожь теперь включается ТОЛЬКО во время
     "дразнящих приступов" через класс .taunt (управляется из JS) */
  #heart .emoji {
    display: inline-block;
    will-change: transform;
  }
  #heart .emoji.taunt {
    animation: jiggle .18s ease-in-out infinite;
  }
  @keyframes jiggle {
    0%   { transform: rotate(-16deg) scale(1.05); }
    25%  { transform: rotate(14deg)  scale(1.18); }
    50%  { transform: rotate(-12deg) scale(.92);  }
    75%  { transform: rotate(16deg)  scale(1.15); }
    100% { transform: rotate(-16deg) scale(1.05); }
  }

  /* Экран победы */
  #win {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: radial-gradient(circle at 50% 40%, rgba(255,40,120,.25), rgba(9,4,24,.96));
    color: #fff;
    padding: 24px;
  }
  #win.show { display: flex; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #win .bigheart {
    font-size: 110px;
    animation: pop .6s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    70%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  #win h2 { font-size: 26px; margin: 18px 0 8px; }
  #win p  { font-size: 16px; opacity: .8; margin: 0; }

  /* Счётчик попыток */
  #tries {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    opacity: .55;
    font-size: 14px;
    z-index: 5;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="title">
    Оцените проведённое тестирование, нажав на сердечко)
    <small></small>
  </div>

  <div id="heart"><span class="emoji">❤️</span></div>

  <div id="tries">Попыток: 0</div>

  <div id="win">
    <div class="bigheart">💖</div>
    <h2>Спасибо за оценку!</h2>
    <p>Тестирование оценено на все 100 ❤️</p>
  </div>

  <script>
    const heart   = document.getElementById('heart');
    const winEl    = document.getElementById('win');
    const triesEl = document.getElementById('tries');

    const HEART_SIZE = 76;
    let tries = 0;
    let caught = false;

    // Текущая и целевая позиция
    let x = 0, y = 0;      // текущая (для плавного скольжения)
    let tx = 0, ty = 0;    // цель
    // амплитуда "дразнящего" покачивания
    let wobbleT = 0;

    function rand(min, max) { return Math.random() * (max - min) + min; }

    // Границы, чтобы сердечко не убегало за экран (учитываем зону надписи сверху)
    function bounds() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const topSafe = h * 0.28;      // ниже надписи
      const botSafe = h * 0.90;      // выше счётчика
      return {
        minX: 8,
        maxX: w - HEART_SIZE - 8,
        minY: topSafe,
        maxY: botSafe - HEART_SIZE
      };
    }

    // Выбрать новую случайную цель подальше от текущей позиции
    function pickTarget() {
      const b = bounds();
      let nx, ny, dist, guard = 0;
      do {
        nx = rand(b.minX, b.maxX);
        ny = rand(b.minY, b.maxY);
        dist = Math.hypot(nx - x, ny - y);
        guard++;
      } while (dist < Math.min(window.innerWidth, window.innerHeight) * 0.35 && guard < 20);
      tx = nx; ty = ny;
    }

    // Инициализация стартовой позиции — по центру
    function initPos() {
      const b = bounds();
      x = tx = (b.minX + b.maxX) / 2;
      y = ty = (b.minY + b.maxY) / 2;
    }
    initPos();

    // Периодически меняем цель — сердечко "телепорт-скользит" по экрану.
    // Быстро и непредсказуемо: короткие случайные интервалы.
    let hopTimer;
    function scheduleHop() {
      const delay = rand(230, 520);   // как часто менять направление (меньше = быстрее)
      hopTimer = setTimeout(() => {
        if (!caught) { pickTarget(); scheduleHop(); }
      }, delay);
    }
    scheduleHop();

    // Реакция "убегания", если палец/курсор близко — сердечко резко отпрыгивает
    function fleeFrom(px, py) {
      if (caught) return;
      const cx = x + HEART_SIZE / 2;
      const cy = y + HEART_SIZE / 2;
      const d = Math.hypot(px - cx, py - cy);
      if (d < 130) {         // зона испуга
        pickTarget();        // сразу новая цель
        // добавим резкий рывок в противоположную сторону
        const b = bounds();
        const away = 170;
        let ax = cx + (cx - px) / (d || 1) * away;
        let ay = cy + (cy - py) / (d || 1) * away;
        tx = Math.max(b.minX, Math.min(b.maxX, ax - HEART_SIZE/2));
        ty = Math.max(b.minY, Math.min(b.maxY, ay - HEART_SIZE/2));
      }
    }

    window.addEventListener('pointermove', e => fleeFrom(e.clientX, e.clientY), { passive: true });

    // Клик/тап по сердечку = победа
    function tryCatch(e) {
      if (caught) return;
      tries++;
      triesEl.textContent = 'Попыток: ' + tries;

      // проверка попадания по реальному положению
      const cx = x + HEART_SIZE / 2;
      const cy = y + HEART_SIZE / 2;
      const px = e.clientX, py = e.clientY;
      const hit = Math.hypot(px - cx, py - cy) < HEART_SIZE * 0.75;

      if (hit) {
        win();
      } else {
        // промах — резко отпрыгнуть
        fleeFrom(px, py);
      }
    }
    // слушаем на всём документе, чтобы считать и промахи
    document.addEventListener('pointerdown', tryCatch);
    // отдельный прямой клик по сердечку — гарантированная победа
    heart.addEventListener('pointerdown', e => { e.stopPropagation(); if(!caught){ tries++; triesEl.textContent='Попыток: '+tries; win(); } });

    function win() {
      caught = true;
      clearTimeout(hopTimer);
      heart.style.display = 'none';
      winEl.classList.add('show');
      if (navigator.vibrate) navigator.vibrate([40, 30, 60]);
    }

    // Главный цикл анимации: быстрое плавное скольжение к цели.
    // Дрожь/покачивание НЕ постоянные — включаются приступами (см. taunt).
    function loop() {
      // плавно, но БЫСТРО движемся к цели (0.14 -> 0.26)
      x += (tx - x) * 0.26;
      y += (ty - y) * 0.26;

      let shakeX = 0, shakeY = 0;
      // мелкое дрожание только во время "дразнящего приступа"
      if (taunting) {
        wobbleT += 1.0;
        shakeX = Math.sin(wobbleT * 2.7) * 5;
        shakeY = Math.cos(wobbleT * 3.3) * 5;
      }

      heart.style.transform =
        `translate(${(x + shakeX).toFixed(2)}px, ${(y + shakeY).toFixed(2)}px)`;

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ---- Дразнящие приступы: сердечко замирает на месте и трясётся ----
    // Происходят периодически, в случайные моменты, ненадолго.
    const emoji = heart.querySelector('.emoji');
    let taunting = false;
    function scheduleTaunt() {
      const wait = rand(1600, 3800);   // пауза между приступами
      setTimeout(() => {
        if (caught) return;
        taunting = true;
        emoji.classList.add('taunt');
        // на время приступа сердечко "замирает" (цель = текущая позиция)
        tx = x; ty = y;
        // короткая вибрация телефона для эффекта
        if (navigator.vibrate) navigator.vibrate(60);

        const dur = rand(400, 750);    // длительность приступа
        setTimeout(() => {
          taunting = false;
          emoji.classList.remove('taunt');
          if (!caught) { pickTarget(); scheduleTaunt(); }
        }, dur);
      }, wait);
    }
    scheduleTaunt();

    // Пересчёт границ при повороте экрана
    window.addEventListener('resize', () => {
      const b = bounds();
      x = Math.max(b.minX, Math.min(b.maxX, x));
      y = Math.max(b.minY, Math.min(b.maxY, y));
      tx = Math.max(b.minX, Math.min(b.maxX, tx));
      ty = Math.max(b.minY, Math.min(b.maxY, ty));
    });
  </script>

</body>
</html>
